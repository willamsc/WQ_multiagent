[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldquant-alpha-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
alpha-platform = "alpha_platform.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", ".pytest-tmp", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
